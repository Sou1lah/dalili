const MSGS={inv:[["Study group","Networks revision","Tomorrow 14:00, Room 12"],["Prof. invitation","Databases quiz","Closes Friday"]],chat:[["Club OSCA","Posters are due before the 26th.","2h"],["L3 Systems group","Who has the TD series 3?","5h"]]};
const ADMIN=[{t:"School certificate",s:["Log in to your student account","Open the certificates section","Request and print, or collect a stamped copy"]},{t:"Grade transcript",s:["Wait for jury validation","Student account, then Results","Download the PDF; visit the office for a stamp"]},{t:"Re-registration",s:["Check dates on the faculty notice board","Pay fees and gather documents","Validate at the student office"]}];
let screen="home",day=today,seg="time",filt="All",q="",inv=[0,0],node=0,gaps=false,qn=10,rt="Self study",hist=[],busy=false,sample=null,pending=null;
const v=document.getElementById("v"),$=s=>document.querySelector(s);
const mins=t=>{const a=t.split(":");return +a[0]*60+ +a[1]};
const tile=(n,l,c,bg,a,val)=>`<button class="tool" data-a="${a}" data-v="${val}"><span style="background:${bg};color:${c}">${ic(n)}</span>${l}</button>`;
function libHtml(){const L=LIB.filter(x=>(filt==="All"||x[6]===filt)&&x[0].toLowerCase().includes(q.toLowerCase()));return L.map(x=>`<div class="card"><div class="top"><b>${x[0]}</b><span class="badge ${x[6]==="Completed"?"g":"t"}">${x[6]}</span></div><div class="meta">${x[2]} questions &middot; ${x[1]} &middot; ${x[3]}</div><div class="pb"><i style="width:${x[4]}%;background:${col(x[4])}"></i></div><small style="display:block;margin-top:8px">${x[5]?`Best: ${x[4]}% &middot; ${x[5]} attempt${x[5]>1?"s":""}`:"No attempts yet"}</small><div class="acts"><button data-a="ask" data-v="Quiz me on ${x[0]} (${x[1]}) with 5 multiple choice questions, one at a time.">${x[5]?"Retake":"Start"}</button>${x[5]?'<button data-a="go" data-v="profile">View results</button>':""}</div></div>`).join("")||"<small>No assessments match.</small>"}
const V={
home:()=>`<div class="card hero"><div class="rw"><div><div class="pts">${P.points.toLocaleString()}</div><small>points</small></div><div style="text-align:right"><div class="rate"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7L2 9.3l7-.8z"/></svg>${P.rating}</div><small>rating &middot; ${P.rank}</small></div></div><div class="bar"><i style="width:${Math.round(P.points/P.next*100)}%"></i></div><small>${P.next-P.points} points to the next level</small></div>
<div><h3 style="font-size:16px;font-weight:600;margin-bottom:10px">Study tools</h3><div class="tools">${tile("plus","Create assessment","#00718d","#d6f1f8","go","create")+tile("map","Knowledge map","#6d28d9","#ece3fd","go","kmap")+tile("flask","Expert research","#6d28d9","#ece3fd","go","research")+tile("cards","Flashcards","#0b7a46","#dcf6e8","ask","Make 6 flashcards to revise computer networks. Show one at a time.")+tile("doc","Learning summary","#9a5a00","#fdebcf","ask","Summarize the key points I should know about operating systems in 8 lines.")+tile("cap","Exam prep plan","#b42318","#fde1de","ask","Build me a short exam prep plan for this week using my schedule and weak subjects.")}</div></div>
<div class="card"><h3>Latest from the faculty</h3>${NEWS.map(n=>`<div class="row"><div class="sq" style="background:${n[3]}22;color:${n[3]}">${ic(n[0])}</div><div><b>${n[1]}</b><small>${n[2]}</small></div></div>`).join("")}</div>
<div class="card"><h3>Recent exercises solved</h3>${LIB.slice(0,4).map(x=>`<div class="row"><div><b>${x[0]}</b><small>${x[1]} &middot; ${x[3]}</small></div><span class="sc ${cls(x[4])}">${x[4]/10}/10</span></div>`).join("")}</div>`,
lib:()=>`<h1>Library</h1><div class="search">${ic("search")}<input id="sq" placeholder="Search assessments" aria-label="Search assessments" value="${q}"></div><div class="chips">${["All","Completed","In progress"].map(f=>`<button data-a="filt" data-v="${f}" class="${f===filt?"on":""}">${f}</button>`).join("")}</div><div id="list" class="lib" style="display:flex;flex-direction:column;gap:12px">${libHtml()}</div>`,
results:()=>{const C2=2*Math.PI*62,pc=P.avg/100;return `<div class="card"><h3>Overall results</h3><div class="ring"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="#e1e8f1" stroke-width="12"/><circle cx="75" cy="75" r="62" fill="none" stroke="#00a0c6" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C2}" stroke-dashoffset="${C2*(1-pc)}"/></svg><div><b>${P.avg}%</b><span class="badge g" style="margin:6px auto 0">Grade B</span></div></div><p style="text-align:center;margin-top:12px">Strong results in operating systems and networks. HMI needs more practice.</p></div>
<div class="stats f4"><div class="stat"><div class="dot g">${ic("check")}</div><b>39</b><small>Correct</small></div><div class="stat"><div class="dot r">${ic("x")}</div><b>9</b><small>Incorrect</small></div><div class="stat"><div class="dot t">${ic("bulb")}</div><b>48</b><small>Questions</small></div><div class="stat"><div class="dot a">${ic("clock")}</div><b>5:39</b><small>Avg time</small></div></div>
<div class="card tint"><h3 style="color:#0b6178">Recommendations</h3><p>A bit more practice and you will be an expert. Focus on the topics you missed.</p></div>
<div class="card"><h3>Score distribution</h3>${[["Excellent",2,"var(--ok)"],["Good",1,"var(--p)"],["Average",0,"var(--warn)"],["Needs work",1,"var(--bad)"]].map(d=>`<div class="dist"><span>${d[0]}</span><div class="pb"><i style="width:${d[1]*40}%;background:${d[2]}"></i></div><em>${d[1]}</em></div>`).join("")}</div>
<div class="card"><h3>Performance insights</h3><small>Strengths</small><div class="pills" style="margin:8px 0 14px"><span class="g">Operating Systems</span><span class="g">Networks</span></div><small>Areas to improve</small><div class="pills" style="margin-top:8px"><span class="a">HMI</span><span class="a">UML class diagrams</span></div></div>`},
plan:()=>{let o=`<h1>Planner</h1><div class="seg"><button data-a="seg" data-v="time" class="${seg==="time"?"on":""}">Timetable</button><button data-a="seg" data-v="exam" class="${seg==="exam"?"on":""}">Exams</button></div>`;
 if(seg==="time"){const H=56,h0=8,h1=18;o+=`<div class="strip">${DAYS.map((d,i)=>{const dt=new Date(wk);dt.setDate(wk.getDate()+i);return `<button data-a="day" data-v="${d}" class="${d===day?"on ":""}${d===today?"td":""}">${d}<span>${dt.getDate()}</span></button>`}).join("")}</div><div class="card" style="padding:14px 10px 10px"><div class="grid" style="height:${H*(h1-h0)}px">`;
 for(let h=h0;h<h1;h++)o+=`<div class="hl" style="top:${(h-h0)*H}px"><span>${h}:00</span></div>`;
 (SCHED[day]||[]).forEach(e=>{o+=`<div class="ev" style="top:${(mins(e[0])-h0*60)/60*H}px;height:${(mins(e[1])-mins(e[0]))/60*H-3}px;background:${e[4]}"><b>${e[2]}</b>${e[0]} - ${e[1]} &middot; ${e[3]}</div>`});
 const nm=now.getHours()*60+now.getMinutes();if(day===today&&nm>h0*60&&nm<h1*60)o+=`<div class="now" style="top:${(nm-h0*60)/60*H}px"></div>`;o+="</div></div>"}
 else{const y=now.getFullYear(),m=now.getMonth(),off=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),ex=EXAMS.filter(e=>e[0]>now.getDate()-1&&e[0]<29+3).map(e=>e[0]);
 o+=`<div class="card"><h3>${now.toLocaleString("en",{month:"long",year:"numeric"})}</h3><div class="mg">${["S","M","T","W","T","F","S"].map(d=>`<small>${d}</small>`).join("")}${"<div></div>".repeat(off)}${Array.from({length:n},(_,i)=>`<div class="${i+1===now.getDate()?"today":""} ${EXAMS.some(e=>e[0]===i+1)&&i+1>=now.getDate()?"x":""}">${i+1}</div>`).join("")}</div></div><div class="card"><h3>Upcoming exams</h3>${EXAMS.map(e=>`<div class="row"><div class="sq" style="background:#ece3fd;color:#6d28d9">${ic("plan")}</div><div><b>${e[1]}</b><small>${e[0]>20?"Day "+e[0]:"Next month, day "+e[0]} &middot; ${e[2]}</small></div></div>`).join("")}</div>`}
 return o},
profile:()=>`<div class="card" style="display:flex;gap:14px;align-items:center"><div class="av big">SS</div><div><h3 style="margin:0">${P.name}</h3><p>${P.prog}</p><p style="margin-top:4px"><b style="color:var(--ink)">${P.points.toLocaleString()}</b> points &middot; ${P.rating} rating</p></div></div><div class="stats"><div class="stat"><b>${P.solved}</b><small>solved</small></div><div class="stat"><b>${P.streak}</b><small>day streak</small></div><div class="stat"><b>${P.avg}%</b><small>avg score</small></div></div>${V.results()}<div class="card"><h3>Progress by subject</h3>${SKILLS.map(s=>`<div class="sub"><span>${s[0]}</span><div class="pb"><i style="width:${s[1]}%;background:${col(s[1])}"></i></div><em>${s[1]}%</em></div>`).join("")}</div><div class="card"><h3>Badges</h3><div class="pills"><span class="a">6-day streak</span><span class="t">Quiz master</span><span class="g">Early bird</span></div></div>`,
msgs:()=>`<div class="card"><h3>Invitations</h3>${MSGS.inv.map((m,i)=>`<div class="row"><div class="sq" style="background:#d6f1f8;color:#00718d">${ic("plane")}</div><div style="flex:1"><b>${m[1]}</b><small>${m[0]} &middot; ${m[2]}</small></div>${inv[i]?`<span class="badge g">Accepted</span>`:`<button class="badge t" style="border:0;cursor:pointer" data-a="acc" data-v="${i}">Accept</button>`}</div>`).join("")}</div><div class="card"><h3>Messages</h3>${MSGS.chat.map(m=>`<div class="row"><div class="av" style="cursor:default;flex:none">${m[0][0]}</div><div style="flex:1"><b>${m[0]}</b><small>${m[1]}</small></div><small>${m[2]}</small></div>`).join("")}</div>`,
kmap:()=>{const N=NODES[node];return `<div class="two"><button class="btn2" style="background:var(--p)" data-a="ask" data-v="Do a deep analysis of my knowledge: weakest topics are HMI (55%) and TCP/IP (64%). What should I study first?">Deep analysis</button><button class="btn2" style="background:var(--pur)" data-a="gaps" data-v="">${gaps?"Show all":"Find gaps"}</button></div><div class="card"><h3>Topic network</h3><svg viewBox="0 0 300 330" width="100%">${EDGES.map(e=>`<line x1="${NODES[e[0]][2]}" y1="${NODES[e[0]][3]}" x2="${NODES[e[1]][2]}" y2="${NODES[e[1]][3]}" stroke="#cbd5e1" stroke-width="2"/>`).join("")}${NODES.map((n,i)=>`<g data-a="node" data-v="${i}" style="cursor:pointer;opacity:${gaps&&n[1]>=70?.25:1}"><circle cx="${n[2]}" cy="${n[3]}" r="${i===node?30:26}" fill="#fff" stroke="${col(n[1])}" stroke-width="${i===node?5:3}"/><text x="${n[2]}" y="${n[3]-2}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f1b2d" font-family="Lexend,sans-serif">${n[0]}</text><text x="${n[2]}" y="${n[3]+11}" text-anchor="middle" font-size="9.5" fill="${col(n[1])}" font-family="Lexend,sans-serif">${n[1]}%</text></g>`).join("")}</svg><small style="display:block;text-align:center">Tap a node to see details</small></div><div class="card"><h3>${N[0]}</h3><small>${N[4]}</small><p style="margin:8px 0 12px">${N[5]}</p><div class="stats"><div class="stat"><b style="color:${col(N[1])}">${N[1]}%</b><small>mastery</small></div><div class="stat"><b>${N[1]>=80?"Strong":N[1]>=60?"Fair":"Weak"}</b><small>level</small></div><div class="stat"><b>${Math.max(1,Math.round((100-N[1])/12))}</b><small>to review</small></div></div></div>`},
create:()=>`<div class="card"><h3>Provide study material</h3><p>Describe a topic or paste your notes. The AI generates a quiz from it.</p></div><textarea id="tx" class="fld" placeholder="Example: TCP three-way handshake and congestion control" aria-label="Topic or notes"></textarea><div class="chips">${[5,10,15].map(n=>`<button data-a="qn" data-v="${n}" class="${n===qn?"on":""}">${n} questions</button>`).join("")}</div><button class="cta" data-a="gen" data-v="quiz">Generate assessment</button>`,
research:()=>`<div class="card"><h3>Research any topic</h3><p>Choose a format and the AI prepares it for you.</p></div><textarea id="tx" class="fld" placeholder="Example: Computer vision in industrial inspection" aria-label="Research topic"></textarea><div>${[["Homework or assignment","Structured for coursework"],["Self study","Easy-to-follow learning"],["Technical report","Detailed technical analysis"],["Executive brief","High-level summary"]].map(o=>`<button class="opt ${o[0]===rt?"on":""}" data-a="rt" data-v="${o[0]}"><div class="sq" style="background:${o[0]===rt?"var(--pur)":"#eef2f7"};color:${o[0]===rt?"#fff":"var(--mute)"}">${ic("doc")}</div><div><b>${o[0]}</b><small>${o[1]}</small></div></button>`).join("")}</div><button class="cta pur" data-a="gen" data-v="research">Start research</button>`,
ask:()=>hist.length?`<div class="chat"><div id="msgs" style="display:flex;flex-direction:column;gap:10px"></div></div>`:`<div class="chat"><div class="empty"><div class="ci">${ic("ai")}</div><h2>Ask Dalili</h2><p>Ask about your courses, schedule, procedures or any study question.</p></div><div class="topics">${[["cap","Exam prep tips","Give me 5 practical tips to prepare for my exams."],["bulb","Better learner","How can I become a better learner with a part-time job?"],["pen","Solve a problem","Help me solve a problem step by step. I will paste it next."],["doc","Summarize notes","I will paste my notes. Summarize them in short bullet points."]].map(t=>`<button data-a="ask" data-v="${t[2]}">${ic(t[0])}${t[1]}</button>`).join("")}</div></div>`
};
const SUB={msgs:["Messages","home"],kmap:["Knowledge map","home"],create:["Create assessment","home"],research:["Expert research","home"]};
const NAVT=[["home","Home"],["lib","Library"],["ask","Ask"],["plan","Planner"],["profile","Profile"]];
function head(){const h=$("#head"),s=SUB[screen];h.innerHTML=s?`<button class="bk" data-a="go" data-v="${s[1]}" aria-label="Back">${ic("back")}</button><b>${s[0]}</b><span style="width:40px"></span>`:`${LOGO}<div class="hr">${screen==="home"?`<button class="ib" data-a="go" data-v="msgs" aria-label="Messages and invitations">${ic("plane")}<i class="bd">3</i></button>`:""}</div>`}
function nav(){$("#nav").innerHTML=NAVT.map(n=>{const a=n[0]==="ask";return `<button data-a="go" data-v="${n[0]}" class="${a?"ask ":""}${n[0]===screen?"on":""}" aria-label="${n[1]}">${a?`<i>${ic("ai")}</i>`:ic(n[0])}${n[1]}</button>`}).join("")}
function render(){v.innerHTML=V[screen]();head();nav();v.scrollTop=0;if(screen==="ask")initChat();const s=$("#sq");if(s)s.oninput=()=>{q=s.value;$("#list").innerHTML=libHtml()}}
function bubble(c,t){const m=document.createElement("div");m.className="msg "+c;m.textContent=t;m.dir="auto";$("#msgs").appendChild(m);v.scrollTo({top:v.scrollHeight,behavior:"smooth"});return m}
function initChat(){if(hist.length){hist.forEach(h=>bubble(h.role==="user"?"me":"bot",h.content));if(!$("#ask-f"))addForm()}else addForm();
 (window.claude?claude.use("sample"):Promise.resolve(null)).then(x=>{sample=x;if(pending){const p=pending;pending=null;ask(p)}}).catch(()=>{})}
function addForm(){const f=document.createElement("form");f.id="ask-f";f.autocomplete="off";f.innerHTML=`<input id="qi" aria-label="Your question" placeholder="How can I help you today?"><button type="submit" aria-label="Send">${ic("send")}</button>`;f.style.marginTop="auto";f.onsubmit=e=>{e.preventDefault();ask($("#qi").value)};v.appendChild(f)}
function act(a,val){
 if(a==="go"){screen=val;render()}
 else if(a==="day"){day=val;render()}else if(a==="seg"){seg=val;render()}
 else if(a==="filt"){filt=val;render()}else if(a==="acc"){inv[+val]=1;render()}
 else if(a==="node"){node=+val;render()}else if(a==="gaps"){gaps=!gaps;render()}
 else if(a==="qn"){qn=+val;render()}else if(a==="rt"){rt=val;const t=$("#tx").value;render();$("#tx").value=t}
 else if(a==="ask"){pending=val;if(screen!=="ask"){screen="ask";render()}else{const p=pending;pending=null;ask(p)}}
 else if(a==="gen"){const t=$("#tx").value.trim()||"my current courses";act("ask",val==="quiz"?`Create a ${qn}-question multiple choice assessment about: ${t}. Ask one question at a time and grade my answers.`:`Prepare a ${rt.toLowerCase()} research document about: ${t}. Keep it clear and well structured.`)}}
document.querySelector(".screen").onclick=e=>{const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b.dataset.v)};
const SYS="You are Dalili.dz, the AI assistant for students of Université Badji Mokhtar Annaba (UBMA), Algeria. Reply in the language the student writes in (English, French or Arabic). Be concise and friendly, plain text only, no markdown. For schedule, exams, library results, procedures and stats, call the tools and rely on their data. Tools hold sample demo data, so say when something should be verified with the administration. Never invent official dates, phone numbers or rules; if unsure, say so and point to the student office. You can tutor, make quizzes and flashcards, summarize and give study plans.";
const tools=[{name:"get_schedule",description:"Classes for a weekday: Sun, Mon, Tue, Wed or Thu",inputSchema:{type:"object",properties:{day:{type:"string"}},required:["day"]},execute:i=>SCHED[i.day]||[]},{name:"get_exams",description:"Upcoming exams (day of month, title, time)",inputSchema:{type:"object",properties:{}},execute:()=>EXAMS},{name:"get_procedure",description:"Steps for an administrative procedure: "+ADMIN.map(a=>a.t).join(", "),inputSchema:{type:"object",properties:{name:{type:"string"}},required:["name"]},execute:i=>{const n=(i.name||"").toLowerCase();return ADMIN.filter(a=>a.t.toLowerCase().includes(n)||n.includes(a.t.toLowerCase()))}},{name:"get_student_stats",description:"Points, rating, streak, average, assessment results and subject mastery",inputSchema:{type:"object",properties:{}},execute:()=>({profile:P,assessments:LIB,mastery:SKILLS})}];
async function ask(t){
 t=(t||"").trim();if(!t||busy)return;
 if(screen!=="ask"){screen="ask";render()}
 if(!$("#msgs")){hist=hist.slice();v.innerHTML=V.ask();v.querySelector(".chat").remove&&0}
 if(!$("#msgs")){v.innerHTML='<div class="chat"><div id="msgs" style="display:flex;flex-direction:column;gap:10px"></div></div>';addForm()}
 const qi=$("#qi");if(qi)qi.value="";
 bubble("me",t);const m=bubble("bot","");m.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
 if(!sample){m.textContent="The AI agent is not available in this view. Open the demo from claude.ai and allow the AI request.";return}
 busy=true;hist.push({role:"user",content:t});
 let h=hist.slice(-10);if(h[0].role!=="user")h=h.slice(1);
 const msgs=h.map((x,i)=>i===0?{role:"user",content:SYS+"\n\n"+x.content}:x);
 try{const r=await sample(msgs,{tools,cache:false,modelTier:"quick",onText:x=>{m.textContent=x.text;v.scrollTo({top:v.scrollHeight})}});m.textContent=r.text;hist.push({role:"assistant",content:r.text})}
 catch(e){m.textContent=e&&e.code==="not_granted"?"Allow the AI request to use the assistant.":"The assistant could not answer right now. Try again in a moment.";hist.pop()}
 busy=false}
const tick=()=>{const d=new Date();$("#clock").textContent=d.getHours()+":"+("0"+d.getMinutes()).slice(-2)};
tick();setInterval(tick,30000);render();
</script>
</body>
</html>
